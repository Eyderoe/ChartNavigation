name: build-package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: ChartNavigation

jobs:
  build-windows:
    name: windows package
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_DIR: ${{ github.workspace }}\build-windows
      INSTALL_DIR: ${{ github.workspace }}\package-windows
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-github-actions,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package date
        id: pkgdate
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          "build_date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\aqtinstall
            C:\Users\runneradmin\AppData\Local\InstallQt
          key: qt-windows-6.9.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtpdf qtpdfwidgets qtpositioning qttools
          cache: true

      - name: Check MinGW version
        run: |
          $mingwVersion = (g++ -dumpfullversion -dumpversion).Trim()
          if (-not $mingwVersion) {
            throw "Unable to detect MinGW version from g++."
          }
          if ([Version]$mingwVersion -lt [Version]"13.1") {
            throw "MinGW version $mingwVersion is below required minimum 13.1."
          }
          Write-Host "Detected MinGW version: $mingwVersion"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-2022-${{ hashFiles('CMakeLists.txt') }}

      - name: Bootstrap vcpkg
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
            & $env:VCPKG_ROOT\bootstrap-vcpkg.bat
          }

      - name: Install dependencies
        run: |
          & $env:VCPKG_ROOT\vcpkg.exe install boost-system protobuf qcoro --triplet x64-mingw-dynamic

      - name: Configure
        run: |
          cmake -S . -B $env:BUILD_DIR `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic

      - name: Build
        run: cmake --build $env:BUILD_DIR --config Release

      - name: Package
        env:
          PACKAGE_FILE: ${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path $env:INSTALL_DIR | Out-Null
          Copy-Item $env:BUILD_DIR\$env:PROJECT_NAME.exe $env:INSTALL_DIR\
          Copy-Item $env:BUILD_DIR\*.dll $env:INSTALL_DIR\ -ErrorAction SilentlyContinue
          if (Test-Path "$env:GITHUB_WORKSPACE\example") {
            Copy-Item "$env:GITHUB_WORKSPACE\example" "$env:INSTALL_DIR\example" -Recurse -Force
          }
          if (Test-Path "$env:QT_ROOT_DIR\bin\windeployqt.exe") {
            & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime $env:INSTALL_DIR\$env:PROJECT_NAME.exe
          }
          Compress-Archive -Path "$env:INSTALL_DIR\*" -DestinationPath "$env:BUILD_DIR\$env:PACKAGE_FILE" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}-windows
          path: ${{ env.BUILD_DIR }}\${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}.zip

  build-macos:
    name: mac package
    runs-on: macos-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/build-macos
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-github-actions,readwrite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package date
        id: pkgdate
        run: |
          date_value=$(date +%Y%m%d)
          echo "build_date=$date_value" >> "$GITHUB_OUTPUT"

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Qt
            ~/Library/Caches/aqtinstall
          key: qt-macos-6.9.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          host: mac
          target: desktop
          modules: qtpdf qtpdfwidgets qtpositioning qttools
          cache: true

      - name: Check Apple Clang version
        run: |
          clang_line="$(clang --version | head -n 1)"
          clang_version="$(echo "$clang_line" | sed -E 's/.*Apple clang version ([0-9]+(\.[0-9]+)?).*/\1/')"
          if [ -z "$clang_version" ]; then
            echo "Unable to parse Apple Clang version from: $clang_line"
            exit 1
          fi
          if [ "$(printf '%s\n' "17.0" "$clang_version" | sort -V | head -n 1)" != "17.0" ]; then
            echo "Apple Clang version $clang_version is below required minimum 17.0."
            exit 1
          fi
          echo "Detected Apple Clang version: $clang_version"

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-macos-14-${{ hashFiles('CMakeLists.txt') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          fi

      - name: Install dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install boost-system protobuf qcoro --triplet arm64-osx

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release

      - name: Package
        env:
          PACKAGE_FILE: ${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}.dmg
        run: |
          PACKAGE_DIR="$BUILD_DIR/${PROJECT_NAME}-bundle"
          rm -rf "$PACKAGE_DIR"
          macdeployqt "$BUILD_DIR/$PROJECT_NAME.app" -always-overwrite
          mkdir -p "$PACKAGE_DIR"
          cp -R "$BUILD_DIR/$PROJECT_NAME.app" "$PACKAGE_DIR/"
          if [ -d "$GITHUB_WORKSPACE/example" ]; then
            cp -R "$GITHUB_WORKSPACE/example" "$PACKAGE_DIR/example"
          fi
          hdiutil create -volname "$PROJECT_NAME" -srcfolder "$PACKAGE_DIR" -ov -format UDZO "$BUILD_DIR/$PACKAGE_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}-macos
          path: ${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}-${{ steps.pkgdate.outputs.build_date }}.dmg
